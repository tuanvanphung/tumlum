<body>
    <h1>Mastery Test: Order of Operations</h1>
    <p class="subtitle">Every problem mixes a fraction, a decimal, a radical, and a power</p>

    <div class="controls-container" id="controls">
        <button id="generateBtn">Generate New Problem Set</button>
        <button id="submitBtn">Submit Answers</button>
        <div class="problem-count" id="problemCount"></div>
    </div>

    <div id="scoreBanner" class="score-banner"></div>
    <div id="problemContainer" class="problem-list"></div>

    <script>
    (() => {
        const container = document.getElementById('problemContainer');
        const controls = document.getElementById('controls');
        const generateBtn = document.getElementById('generateBtn');
        const problemCountEl = document.getElementById('problemCount');
        const scoreBanner = document.getElementById('scoreBanner');

        let currentProblems = [];
        let completedReportData = [];
        let isSubmitted = false;

        const EPSILON = 0.00001;
        const MAX_INTERMEDIATE_VALUE = 99999;
        const CIPHER_KEY = "OrderOfOps_SecureKey_Steps_4719";

        function encrypt(str) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(str);
            const keyBytes = encoder.encode(CIPHER_KEY);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] ^= keyBytes[i % keyBytes.length];
            }
            let bin = "";
            for (let i = 0; i < bytes.length; i++) {
                bin += String.fromCharCode(bytes[i]);
            }
            return btoa(bin);
        }

        function decrypt(str) {
            const bin = atob(str);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) {
                bytes[i] = bin.charCodeAt(i);
            }
            const encoder = new TextEncoder();
            const keyBytes = encoder.encode(CIPHER_KEY);
            for (let i = 0; i < bytes.length; i++) {
                bytes[i] ^= keyBytes[i % keyBytes.length];
            }
            return new TextDecoder().decode(bytes);
        }

        function typesetMath(elements) {
            if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                return window.MathJax.typesetPromise(elements).catch((err) => console.warn('MathJax typesetting warning:', err));
            }
            return Promise.resolve();
        }

        window.triggerMathTypeset = () => {
            typesetMath([container]);
        };

        // =============================================================
        // UTILITY & MATH ENGINE
        // =============================================================
        function isValueTooLarge(frac) {
            if (!frac || typeof frac.num === 'undefined' || typeof frac.den === 'undefined') return true;
            return Math.abs(frac.num) > MAX_INTERMEDIATE_VALUE || Math.abs(frac.den) > MAX_INTERMEDIATE_VALUE;
        }
        function getRandomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

        function simplifyFraction(num, den) {
            function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
            if (den === 0) {
                if (num === 0) return { num: 0, den: 0, isFraction: true, value: NaN, error: "0/0" };
                return { num: num > 0 ? 1 : -1, den: 0, isFraction: true, value: Infinity * Math.sign(num), error: "Div 0" };
            }
            if (den < 0) { num = -num; den = -den; }
            const common = gcd(Math.abs(num), Math.abs(den));
            return { num: num / common, den: den / common, isFraction: true, value: (num / common) / (den / common) };
        }

        function toFraction(numInput) {
            if (typeof numInput === 'object' && numInput.isFraction) return numInput;
            let originalNumInputStr = String(numInput);
            let num = Number(numInput);
            if (Number.isNaN(num)) return { num: 0, den: 0, isFraction: true, value: NaN, error: "NaN" };
            if (num === Infinity) return { num: 1, den: 0, isFraction: true, value: Infinity };
            if (num === -Infinity) return { num: -1, den: 0, isFraction: true, value: -Infinity };
            if (num % 1 !== 0) {
                if (originalNumInputStr.includes('.')) {
                    const decimalPlaces = originalNumInputStr.split('.')[1].length;
                    const denominator = Math.pow(10, decimalPlaces);
                    const numerator = Math.round(num * denominator);
                    return simplifyFraction(numerator, denominator);
                }
            }
            return { num: Math.round(num), den: 1, isFraction: true, value: Math.round(num) };
        }

        function addFrac(f1, f2) { return simplifyFraction(f1.num * f2.den + f2.num * f1.den, f1.den * f2.den); }
        function subFrac(f1, f2) { return simplifyFraction(f1.num * f2.den - f2.num * f1.den, f1.den * f2.den); }
        function mulFrac(f1, f2) { return simplifyFraction(f1.num * f2.num, f1.den * f2.den); }
        function divFrac(f1, f2) {
            if (f2.num === 0) return { num: 1, den: 0, isFraction: true, value: Infinity, error: "Div 0" };
            return simplifyFraction(f1.num * f2.den, f1.den * f2.num);
        }
        function absFrac(f) {
            const num = Math.abs(f.num);
            const den = f.den;
            const value = den === 0 ? Math.abs(f.value) : num / den;
            return { num, den, isFraction: true, value };
        }

        function formatFractionLaTeX(num, den) {
            if (den === 1) return `${num}`;
            if (num < 0) return `-\\frac{${Math.abs(num)}}{${den}}`;
            return `\\frac{${num}}{${den}}`;
        }
        function formatNumber(n) {
            if (!n) return 'Error';
            if (n.isFraction) {
                if (n.den === 1) return n.num.toString();
                if (Number.isNaN(n.value)) return "\\text{NaN}";
                if (n.value === Infinity) return "\\infty";
                if (n.value === -Infinity) return "-\\infty";
                return formatFractionLaTeX(n.num, n.den);
            }
            return n.value !== undefined ? n.value.toString() : 'Error';
        }

        const PERFECT_SQUARES = [
            { rad: 4, root: 2 }, { rad: 9, root: 3 }, { rad: 16, root: 4 },
            { rad: 25, root: 5 }, { rad: 36, root: 6 }, { rad: 49, root: 7 },
            { rad: 64, root: 8 }, { rad: 81, root: 9 }, { rad: 100, root: 10 }
        ];
        const EASY_FRACTIONS = [[1,2],[3,2],[1,4],[3,4],[5,4],[1,5],[2,5],[3,5],[4,5]];
        const EASY_DECIMALS = ["0.5", "1.5", "2.5", "0.2", "0.4", "0.6", "0.8", "0.25", "0.75"];

        // FIXED BUG: Fractions used with explicit arithmetic operators must be positive
        // to prevent ill-formed double negatives like "+ -" or "- -"
        function easyFraction() {
            const [n, d] = getRandomItem(EASY_FRACTIONS);
            return simplifyFraction(n, d);
        }
        function easyDecimalStr() { return getRandomItem(EASY_DECIMALS); }

        const EASY_POWERS = [
            { tex: "2^2", frac: { num: 4, den: 1 }, desc: "2^2 = 4" },
            { tex: "2^3", frac: { num: 8, den: 1 }, desc: "2^3 = 8" },
            { tex: "2^4", frac: { num: 16, den: 1 }, desc: "2^4 = 16" },
            { tex: "3^2", frac: { num: 9, den: 1 }, desc: "3^2 = 9" },
            { tex: "3^3", frac: { num: 27, den: 1 }, desc: "3^3 = 27" },
            { tex: "4^2", frac: { num: 16, den: 1 }, desc: "4^2 = 16" },
            { tex: "5^2", frac: { num: 25, den: 1 }, desc: "5^2 = 25" },

            { tex: "2^{-1}", frac: { num: 1, den: 2 }, desc: "2^{-1} = \\frac{1}{2}" },
            { tex: "4^{-1}", frac: { num: 1, den: 4 }, desc: "4^{-1} = \\frac{1}{4}" },
            { tex: "5^{-1}", frac: { num: 1, den: 5 }, desc: "5^{-1} = \\frac{1}{5}" },
            { tex: "2^{-2}", frac: { num: 1, den: 4 }, desc: "2^{-2} = \\frac{1}{2^2} = \\frac{1}{4}" },
            { tex: "2^{-3}", frac: { num: 1, den: 8 }, desc: "2^{-3} = \\frac{1}{2^3} = \\frac{1}{8}" },

            { tex: "4^{\\frac{1}{2}}", frac: { num: 2, den: 1 }, desc: "4^{\\frac{1}{2}} = \\sqrt{4} = 2" },
            { tex: "9^{\\frac{1}{2}}", frac: { num: 3, den: 1 }, desc: "9^{\\frac{1}{2}} = \\sqrt{9} = 3" },
            { tex: "16^{\\frac{1}{2}}", frac: { num: 4, den: 1 }, desc: "16^{\\frac{1}{2}} = \\sqrt{16} = 4" },
            { tex: "25^{\\frac{1}{2}}", frac: { num: 5, den: 1 }, desc: "25^{\\frac{1}{2}} = \\sqrt{25} = 5" },
            { tex: "8^{\\frac{1}{3}}", frac: { num: 2, den: 1 }, desc: "8^{\\frac{1}{3}} = \\sqrt[3]{8} = 2" },
            { tex: "27^{\\frac{1}{3}}", frac: { num: 3, den: 1 }, desc: "27^{\\frac{1}{3}} = \\sqrt[3]{27} = 3" },
            { tex: "4^{\\frac{3}{2}}", frac: { num: 8, den: 1 }, desc: "4^{\\frac{3}{2}} = (\\sqrt{4})^3 = 2^3 = 8" },
            { tex: "8^{\\frac{2}{3}}", frac: { num: 4, den: 1 }, desc: "8^{\\frac{2}{3}} = (\\sqrt[3]{8})^2 = 2^2 = 4" },

            { tex: "4^{-\\frac{1}{2}}", frac: { num: 1, den: 2 }, desc: "4^{-\\frac{1}{2}} = \\frac{1}{\\sqrt{4}} = \\frac{1}{2}" },
            { tex: "16^{-\\frac{1}{2}}", frac: { num: 1, den: 4 }, desc: "16^{-\\frac{1}{2}} = \\frac{1}{\\sqrt{16}} = \\frac{1}{4}" },
            { tex: "25^{-\\frac{1}{2}}", frac: { num: 1, den: 5 }, desc: "25^{-\\frac{1}{2}} = \\frac{1}{\\sqrt{25}} = \\frac{1}{5}" },
            { tex: "8^{-\\frac{1}{3}}", frac: { num: 1, den: 2 }, desc: "8^{-\\frac{1}{3}} = \\frac{1}{\\sqrt[3]{8}} = \\frac{1}{2}" }
        ];

        function easyPower() {
            const p = getRandomItem(EASY_POWERS);
            return {
                tex: p.tex,
                frac: simplifyFraction(p.frac.num, p.frac.den),
                desc: p.desc
            };
        }

        const TOWER_POWERS = [
            { tex: "4^{2^{-1}}", frac: { num: 2, den: 1 }, desc: "Top-down tower: \\(2^{-1} = \\frac{1}{2}\\), so \\(4^{\\frac{1}{2}} = \\sqrt{4} = 2\\)" },
            { tex: "9^{2^{-1}}", frac: { num: 3, den: 1 }, desc: "Top-down tower: \\(2^{-1} = \\frac{1}{2}\\), so \\(9^{\\frac{1}{2}} = \\sqrt{9} = 3\\)" },
            { tex: "16^{2^{-1}}", frac: { num: 4, den: 1 }, desc: "Top-down tower: \\(2^{-1} = \\frac{1}{2}\\), so \\(16^{\\frac{1}{2}} = \\sqrt{16} = 4\\)" },
            { tex: "25^{2^{-1}}", frac: { num: 5, den: 1 }, desc: "Top-down tower: \\(2^{-1} = \\frac{1}{2}\\), so \\(25^{\\frac{1}{2}} = \\sqrt{25} = 5\\)" },
            { tex: "8^{3^{-1}}", frac: { num: 2, den: 1 }, desc: "Top-down tower: \\(3^{-1} = \\frac{1}{3}\\), so \\(8^{\\frac{1}{3}} = \\sqrt[3]{8} = 2\\)" },
            { tex: "27^{3^{-1}}", frac: { num: 3, den: 1 }, desc: "Top-down tower: \\(3^{-1} = \\frac{1}{3}\\), so \\(27^{\\frac{1}{3}} = \\sqrt[3]{27} = 3\\)" },
            { tex: "2^{2^2}", frac: { num: 16, den: 1 }, desc: "Top-down tower: \\(2^2 = 4\\), so \\(2^4 = 16\\)" },
            { tex: "3^{2^2}", frac: { num: 81, den: 1 }, desc: "Top-down tower: \\(2^2 = 4\\), so \\(3^4 = 81\\)" }
        ];

        function easyTowerPower() {
            const t = getRandomItem(TOWER_POWERS);
            return {
                tex: t.tex,
                frac: simplifyFraction(t.frac.num, t.frac.den),
                desc: t.desc
            };
        }

        function perfectSquare() { return getRandomItem(PERFECT_SQUARES); }

        function isNiceAnswer(f) {
            if (!f || typeof f.value === 'undefined' || !Number.isFinite(f.value)) return false;
            if (Math.abs(f.value) > 100) return false;
            if ([1, 2, 4, 5, 8, 10].includes(f.den)) return true;
            return false;
        }

        // =============================================================
        // PROBLEM TEMPLATES
        // =============================================================
        const problemTemplates = [
            function () {
                const R = perfectSquare(), F = easyFraction(), dStr = easyDecimalStr(), D = toFraction(dStr), P = easyPower();
                const o1 = getRandomItem(['+', '-']), o2 = getRandomItem(['+', '-']), o3 = getRandomItem(['+', '-']);

                let v1 = toFraction(R.root);
                let v2 = this.checkInt(o1 === '+' ? addFrac(v1, F) : subFrac(v1, F));
                let v3 = this.checkInt(o2 === '+' ? addFrac(v2, D) : subFrac(v2, D));
                let finalAns = this.checkInt(o3 === '+' ? addFrac(v3, P.frac) : subFrac(v3, P.frac));

                this.finalAnswer = finalAns;
                this.problemString = `\\sqrt{${R.rad}} ${o1} ${formatNumber(F)} ${o2} ${dStr} ${o3} ${P.tex}`;
                this.steps = [
                    `<strong>Step 1: Evaluate Powers & Radicals</strong><br>
                     Power: \\(${P.desc}\\).<br>
                     Radical: \\(\\sqrt{${R.rad}} = ${R.root}\\).<br>
                     Expression becomes: \\(${R.root} ${o1} ${formatNumber(F)} ${o2} ${dStr} ${o3} ${formatNumber(P.frac)}\\)`,
                    `<strong>Step 2: Add and Subtract (Left to Right)</strong><br>
                     Convert decimal to fraction: \\(${dStr} = ${formatNumber(D)}\\).<br>
                     First: \\(${R.root} ${o1} ${formatNumber(F)} = ${formatNumber(v2)}\\).<br>
                     Second: \\(${formatNumber(v2)} ${o2} ${formatNumber(D)} = ${formatNumber(v3)}\\).<br>
                     Final: \\(${formatNumber(v3)} ${o3} ${formatNumber(P.frac)} = ${formatNumber(finalAns)}\\)`
                ];
            },

            function () {
                const R = perfectSquare(), P = easyPower(), F = easyFraction(), dStr = easyDecimalStr(), D = toFraction(dStr);
                const o1 = getRandomItem(['+', '-']), o2 = getRandomItem(['+', '-']);

                let inner = this.checkInt(o1 === '+' ? addFrac(toFraction(R.root), P.frac) : subFrac(toFraction(R.root), P.frac));
                let prod = this.checkInt(mulFrac(inner, F));
                let finalAns = this.checkInt(o2 === '+' ? addFrac(prod, D) : subFrac(prod, D));

                this.finalAnswer = finalAns;
                this.problemString = `\\left(\\sqrt{${R.rad}} ${o1} ${P.tex}\\right) \\times ${formatNumber(F)} ${o2} ${dStr}`;
                this.steps = [
                    `<strong>Step 1: Inside Parentheses</strong><br>
                     \\(\\sqrt{${R.rad}} = ${R.root}\\) and \\(${P.desc}\\).<br>
                     Inside result: \\(${R.root} ${o1} ${formatNumber(P.frac)} = ${formatNumber(inner)}\\).`,
                    `<strong>Step 2: Multiply</strong><br>
                     \\(${formatNumber(inner)} \\times ${formatNumber(F)} = ${formatNumber(prod)}\\).`,
                    `<strong>Step 3: Add / Subtract Decimal</strong><br>
                     Convert \\(${dStr} = ${formatNumber(D)}\\).<br>
                     \\(${formatNumber(prod)} ${o2} ${formatNumber(D)} = ${formatNumber(finalAns)}\\)`
                ];
            },

            function () {
                const R = perfectSquare(), P = easyPower(), F = easyFraction(), dStr = easyDecimalStr(), D = toFraction(dStr);
                const o1 = getRandomItem(['+', '-']);

                let div = this.checkInt(divFrac(P.frac, toFraction(R.root)));
                let prod = this.checkInt(mulFrac(F, D));
                let finalAns = this.checkInt(o1 === '+' ? addFrac(div, prod) : subFrac(div, prod));

        function parseUserFractionInput(inputStr) {
            if (!inputStr) return NaN;
            let str = String(inputStr).trim().toLowerCase().replace(/[()]/g, '');
            if (str === "") return NaN;

            // Normalize European decimal comma (e.g. "3,5" -> "3.5")
            str = str.replace(',', '.');

            // Support mixed numbers like "3 1/2", "-2 3/4"
            const mixedMatch = str.match(/^(-)?(\d+)\s+([0-9.]+)\/([0-9.]+)$/);
            if (mixedMatch) {
                const sign = mixedMatch[1] === '-' ? -1 : 1;
                const whole = parseFloat(mixedMatch[2]);
                const num = parseFloat(mixedMatch[3]);
                const den = parseFloat(mixedMatch[4]);
                if (den !== 0 && !isNaN(whole) && !isNaN(num) && !isNaN(den)) {
                    return sign * (whole + num / den);
                }
            }

            // Remove internal whitespace
            str = str.replace(/\s+/g, '');

            // Support simple fractions like "7/2", "-3/4", "+1/5"
            if (str.includes('/')) {
                const parts = str.split('/');
                if (parts.length === 2) {
                    const num = parseFloat(parts[0]);
                    const den = parseFloat(parts[1]);
                    if (!isNaN(num) && !isNaN(den)) {
                        if (den === 0) return NaN;
                        return num / den;
                    }
                }
                return NaN;
            }

            return parseFloat(str);
        }

        function generateProblem(templateFn) {
            let attemptLimit = 250;
            while (attemptLimit > 0) {
                let ctx = {
                    problemString: '', finalAnswer: undefined, steps: [],
                    checkInt: function(value) {
                        if (!value || typeof value.num === 'undefined') throw new Error("Malformed math");
                        if (value.error || isValueTooLarge(value)) throw new Error("Safety limit");
                        return value;
                    }
                };
                try {
                    templateFn.call(ctx);
                    if (ctx.finalAnswer && ctx.finalAnswer.value !== undefined
                        && Number.isFinite(ctx.finalAnswer.value)
                        && ctx.problemString && ctx.steps.length > 0
                        && isNiceAnswer(ctx.finalAnswer)) {
                        return {
                            problemHTML: ctx.problemString,
                            answer: ctx.finalAnswer,
                            steps: ctx.steps
                        };
                    }
                    attemptLimit--;
                } catch (e) { attemptLimit--; }
            }
            return {
                problemHTML: "\\sqrt{16} + \\frac{1}{2} - 0.5 + 2^{2}",
                answer: toFraction(8),
                steps: [
                    "<strong>Step 1: Powers & Roots</strong>: \\(\\sqrt{16} = 4\\) and \\(2^2 = 4\\).",
                    "<strong>Step 2: Arithmetic (Left to Right)</strong>: \\(4 + \\frac{1}{2} - 0.5 + 4 = 8\\)."
                ]

                    problemHTML: data.problemHTML,
                    userRaw: rawVal || "(No answer)",
                    correctFormatted: formatNumber(correctObj),
                    isCorrect: isCorrect,
                    steps: data.steps
                });
            });

            // Automatically download formatted HTML report on submission
            downloadReportHTML();

            const pct = Math.round((score / problemTemplates.length) * 100);
            scoreBanner.innerHTML = `
                <h2>Test Completed! Score: ${score} / ${problemTemplates.length} (${pct}%)\u200b</h2>
                <p>Review the step-by-step explanations below. Your formatted HTML report has been downloaded automatically. Click <strong>"Generate New Problem Set"</strong> to try again.</p>
            `;
            scoreBanner.style.display = 'block';

            typesetMath([scoreBanner, container]);
        }

        generateBtn.addEventListener('click', render);
        render();
    })();
    </script>
</body>
</html>
