<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violin Assignment Page</title>
    <style>
        :root {
            --violin-orange: #d35400;
            --main-wood: #8B4513;
            --bg-color: #fdfcf0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .assignment-card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid var(--violin-orange);
        }

        h1 { color: var(--main-wood); text-align: center; margin-bottom: 10px; }

        .resource-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid var(--violin-orange);
        }

        .resource-link {
            display: block;
            color: var(--violin-orange);
            text-decoration: none;
            font-weight: bold;
            margin: 5px 0;
        }

        .resource-link:hover { text-decoration: underline; }

        .task-list { list-style: none; padding: 0; }

        .task-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .task-item:hover { background: #fffcf5; }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: var(--violin-orange);
        }

        .task-info { flex-grow: 1; }

        .video-btn {
            background: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .video-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="assignment-card">
    <h1>🎻 Assignments</h1>
    
    <!-- Resources / Lesson Links -->
    <div id="resource-links" class="resource-section">
        <!-- Links will appear here -->
    </div>

    <!-- Main Checklist -->
    <ul id="assignment-list" class="task-list">
        <!-- Tasks will appear here -->
    </ul>
</div>

<script>
    /* ==========================================
       EDIT YOUR DATA HERE
       ========================================== */

    // 1. TOP LINKS (Add Lesson links here)
    const lessons = [
        { name: "Weekly", url: "http://lesson1.musica.com" },
        { name: "Free Violin Tuner", url: "https://tuner.example.com" }
    ];

    // 2. ASSIGNMENT LIST
    // To add a task, copy a line and change the name/url.
    const assignments = [
        { name: "Warm Up 1", url: "https://www.youtube.com/watch?v=36lqtAwswpM&list=PLLuzQvZbRBkJ19CnoICv8Zapo5bwbqZZ5&index=2" },
        { name: "Warm Up 2", url: "https://www.youtube.com/watch?v=5mAb3bqotVU&list=PLLuzQvZbRBkJ19CnoICv8Zapo5bwbqZZ5&index=1" }
    ];

    /* ==========================================
       AUTO-GENERATION CODE (Don't need to edit)
       ========================================== */

    const resourceBox = document.getElementById('resource-links');
    lessons.forEach(link => {
        resourceBox.innerHTML += `<a href="${link.url}" class="resource-link" target="_blank">🔗 ${link.name}</a>`;
    });

    const taskList = document.getElementById('assignment-list');
    assignments.forEach(task => {
        taskList.innerHTML += `
            <li class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <span>${task.name}</span>
                </div>
                <a href="${task.url}" class="video-btn" target="_blank">Watch Video</a>
            </li>
        `;
    });
</script>

</body>
</html>
