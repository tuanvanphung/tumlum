<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Violin Warm-up Routine</title>
    <style>
        :root {
            --violin-orange: #d35400;
            --main-wood: #8B4513;
            --bg-color: #fdfcf0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .assignment-card {
            background: white;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            border-top: 8px solid var(--violin-orange);
        }

        h1 { color: var(--main-wood); text-align: center; margin-bottom: 10px; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; font-style: italic; }

        .resource-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border-left: 4px solid var(--violin-orange);
        }

        .resource-link {
            display: block;
            color: var(--violin-orange);
            text-decoration: none;
            font-weight: bold;
            margin: 5px 0;
        }

        .resource-link:hover { text-decoration: underline; }

        .task-list { list-style: none; padding: 0; }

        .task-item {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .task-item:hover { background: #fffcf5; }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
            accent-color: var(--violin-orange);
        }

        .task-info { flex-grow: 1; }
        .task-name { font-weight: 600; color: #333; display: block; }
        .task-desc { font-size: 0.85em; color: #777; }

        .video-btn {
            background: #e74c3c;
            color: white;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-left: 10px;
            white-space: nowrap;
        }

        .video-btn:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="assignment-card">
    <h1>🎻 Warm-up Routine</h1>
    <p class="subtitle">Focus: Intonation, Dexterity, and Tonal Consistency</p>
    
    <!-- Resources / Lesson Links -->
    <div id="resource-links" class="resource-section">
        <!-- Links will appear here -->
    </div>

    <!-- Main Checklist -->
    <ul id="assignment-list" class="task-list">
        <!-- Tasks will appear here -->
    </ul>
</div>

<script>
    /* ==========================================
       EDIT YOUR DATA HERE
       ========================================== */

    // 1. TOP LINKS
    const lessons = [
        { name: "Online Metronome", url: "https://www.metronomeonline.com/" },
        { name: "IMSLP Free Sheet Music", url: "https://imslp.org/" }
    ];

    // 2. WARM-UP TASK LIST
    const assignments = [
        { 
            name: "3-Octave G Major Scale", 
            desc: "Focus on clean shifting and fluid bow changes.",
            url: "https://www.youtube.com/results?search_query=violin+3+octave+G+major+scale" 
        },
        { 
            name: "Schradieck No. 1", 
            desc: "Finger dexterity: Keep fingers close to the strings.",
            url: "https://www.youtube.com/results?search_query=schradieck+1+violin+tutorial" 
        },
        { 
            name: "Sevcik Op. 8 (Shifting)", 
            desc: "Practice slow slides to master the 1st to 3rd position gap.",
            url: "https://www.youtube.com/results?search_query=sevcik+op+8+violin+tutorial" 
        },
        { 
            name: "Vibrato Pulses", 
            desc: "Set metronome to 60. Practice 2, 3, and 4 waves per beat.",
            url: "https://www.youtube.com/results?search_query=violin+vibrato+exercises" 
        }
    ];

    /* ==========================================
       AUTO-GENERATION CODE
       ========================================== */

    const resourceBox = document.getElementById('resource-links');
    lessons.forEach(link => {
        resourceBox.innerHTML += `<a href="${link.url}" class="resource-link" target="_blank">🔗 ${link.name}</a>`;
    });

    const taskList = document.getElementById('assignment-list');
    assignments.forEach(task => {
        taskList.innerHTML += `
            <li class="task-item">
                <input type="checkbox">
                <div class="task-info">
                    <span class="task-name">${task.name}</span>
                    <span class="task-desc">${task.desc}</span>
                </div>
                <a href="${task.url}" class="video-btn" target="_blank">Watch Guide</a>
            </li>
        `;
    });
</script>
 
</body>
</html>
